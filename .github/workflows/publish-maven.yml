name: Publish Copper Maven Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Maven Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Copper
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: |
          chmod +x ./gradlew
          ls -l ./gradlew
          file ./gradlew

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: |
          ls -l ./gradlew
          ./gradlew --version

      - name: Publish Copper API
        run: ./gradlew publish

      - name: Upload Maven Repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/repo

  deploy:
    name: Deploy Maven Repository
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Create repository index
        run: |
          cat > build/repo/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Copper Maven Repository</title>
          </head>
          <body>
            <h1>⚒️ Copper Maven Repository</h1>
            <p>Official Maven repository for the Copper mod loader.</p>
          </body>
          </html>
          EOF